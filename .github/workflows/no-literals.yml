name: 🪶 Localization lint

on:
  pull_request:

# Lint untrusted PR code without publishing permissions or repository secrets.
permissions:
  contents: read

jobs:
  no-literals:
    name: 🪶 no literals (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check localization
        run: pnpm no-literals
      - name: Test localization and native configuration
        run: pnpm test:unit --run
